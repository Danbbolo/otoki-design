<style>
  :root {
    --bg: #0E1116;
    --panel: #171B22;
    --raised: #2A313B;
    --text: #C9D1DB;
    --muted: #8E97A5;
    --accent: #8FA0C4;
    --line: #2A313B;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.5 Inter, system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  header {
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap;
    padding: 18px 28px;
    background: rgba(14,17,22,.92);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line);
  }
  h1 { font-size: 18px; font-weight: 600; letter-spacing: -0.01em; margin: 0; }
  header .count {
    font: 12px "IBM Plex Mono", ui-monospace, monospace; color: var(--muted);
  }
  header .spacer { flex: 1; }
  header a {
    color: var(--accent); text-decoration: none; font-size: 13px;
  }
  header a:hover { text-decoration: underline; }
  .grid {
    display: grid; gap: 20px; padding: 24px 28px 60px;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  }
  figure { margin: 0; }
  .frame {
    position: relative;
    aspect-ratio: 1440 / 860;
    overflow: hidden;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--panel);
  }
  .frame img {
    display: block; width: 100%; height: 100%; object-fit: cover;
    object-position: top left;
  }
  /* The live screen replaces the thumbnail on hover. It is created on
     demand — 43 iframes loading 170 KB each would stall the page. */
  .frame iframe {
    position: absolute; inset: 0;
    width: 1440px; height: 860px; border: 0;
    transform-origin: top left;
    pointer-events: none;
    display: none;
  }
  figure:hover .frame iframe { display: block; }
  figcaption {
    display: flex; align-items: baseline; gap: 8px;
    margin-top: 8px;
  }
  .name {
    color: var(--text); font-size: 13px; font-weight: 500;
    text-decoration: none;
  }
  .name:hover { color: var(--accent); }
  .meta {
    font: 11px "IBM Plex Mono", ui-monospace, monospace; color: var(--muted);
  }
</style>

<script>
  // Swap the static thumbnail for the live screen while the pointer is
  // over it. The iframe is built on first hover and then reused.
  (function () {
    var SCALE = 300 / 1440;
    document.querySelectorAll('.frame').forEach(function (frame) {
      var iframe = null;
      frame.addEventListener('mouseenter', function () {
        if (!iframe) {
          iframe = document.createElement('iframe');
          iframe.src = frame.dataset.screen;
          iframe.scrolling = 'no';
          iframe.style.transform = 'scale(' + SCALE + ')';
          frame.appendChild(iframe);
        }
      });
    });
  })();
</script>
